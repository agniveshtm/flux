[project]
name = "flux"
version = "0.1.0"
description = "flux - A Webview app built for file conversions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pywebview>=6.2.1",
]

[project.scripts]
flux = "flux.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
