[project]
name = "flux"
version = "0.1.0"
description = "Convert files locally with using flux app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pywebview>=6.2.1",
]

[project.scripts]
flux = "flux.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
