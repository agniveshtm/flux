name: Update cache

# Writes docs/cache.json, which docs/index.html reads to show releases and
# recent commits. Same shape as the Portfolio repo's update-cache workflow: a
# scheduled job fetches from GitHub, flattens it to one small JSON file, and
# commits it, so the page itself never makes an authenticated request.
#
# REST rather than GraphQL on purpose. GraphQL would need a token, and a token
# in browser JavaScript would be public to anyone who views source. REST needs
# none, which is why the Portfolio workflow uses it too.
on:
  release:
    types: [published]
  schedule:
    # Deliberately off the hour: every workflow scheduled at :00 fires at the
    # same instant across GitHub's fleet.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch releases and commits
        env:
          # Optional. Lifts the unauthenticated 60 requests/hour cap that a
          # shared runner IP can otherwise hit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl -sf "https://api.github.com/repos/agniveshtm/flux/releases?per_page=25" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: flux-cache" \
            ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} > /tmp/releases.json

          curl -sf "https://api.github.com/repos/agniveshtm/flux/commits?per_page=20" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: flux-cache" \
            ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} > /tmp/commits.json

          # -r: without it jq JSON-encodes its output, and the timestamp would
          # reach cache.json wrapped in literal quote characters.
          jq -rn 'now | todate' > /tmp/now.txt

          # The filter lives in scripts/build_cache.jq rather than inline.
          # A jq program nested in a YAML block scalar and a shell single quote
          # cannot contain an apostrophe, and the quoting around it is what
          # broke the previous run. -f also makes the filter testable directly.
          jq -n \
            --rawfile releases /tmp/releases.json \
            --rawfile commits /tmp/commits.json \
            --arg fetchedAt "$(cat /tmp/now.txt)" \
            -f scripts/build_cache.jq > docs/cache.json

          jq -r '"cache.json - \(.releases | length) release(s), \(.commits | length) commit(s), latest \(.latest // "none")"' docs/cache.json

      - name: Commit
        run: |
          if git diff --quiet -- docs/cache.json; then
            echo "cache already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cache.json
          # No [skip ci]: the commit that updates the cache is what triggers a
          # Pages redeploy, which is how a new release reaches the site.
          git commit -m "chore: update cache"
          # Pushed to an explicit branch rather than bare `git push`: a release
          # event checks out the tag, so HEAD is detached and a bare push fails
          # with "fatal: You are not currently on a branch."
          git push origin HEAD:main
