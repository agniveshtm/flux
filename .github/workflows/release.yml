name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches pyproject.toml and flux.__version__
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "([^"]+)"/\1/')"
          init_version="$(grep -E '^__version__ = ' src/flux/__init__.py | head -1 | sed -E 's/^__version__ = "([^"]+)"/\1/')"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag version '$tag_version' does not match pyproject.toml version '$pyproject_version'"
            exit 1
          fi
          if [ "$pyproject_version" != "$init_version" ]; then
            echo "pyproject.toml version '$pyproject_version' does not match flux.__version__ '$init_version'"
            exit 1
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run pytest tests/

  build-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv python install 3.12
      - run: uv sync
      - name: Build executable (PyInstaller)
        run: uv run pyinstaller flux.spec
      - name: Smoke test the built executable
        # PowerShell does not wait for windowed (console-less) executables,
        # so Start-Process -Wait is required to observe the exit code.
        # -RedirectStandardOutput hands the process a real stdout handle, so
        # sys.stdout exists even without a console and the printed version is
        # assertable (sys.stdout is None only when nothing supplies a handle,
        # e.g. a plain Explorer launch). This still runs the full frozen import
        # chain (webview, Pillow, flux) without opening a window.
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $out = Join-Path $env:TEMP 'flux-version.txt'
          $proc = Start-Process -FilePath ".\dist\flux.exe" -ArgumentList "--version" -Wait -PassThru -RedirectStandardOutput $out
          if ($proc.ExitCode -ne 0) { throw "flux.exe --version exited with code $($proc.ExitCode)" }
          $reported = (Get-Content $out -Raw).Trim()
          if ($reported -ne "flux $version") { throw "flux.exe --version reported '$reported', expected 'flux $version'" }
      - name: Fetch the verified ffmpeg binary
        # vendor/*.exe is gitignored, so a clean checkout has no sidecar.
        # Re-download the pinned gyan.dev archive and verify both the
        # archive and the extracted exe before anything is staged or run
        # (provenance and digests in vendor/README.md).
        shell: pwsh
        run: |
          $archive = "ffmpeg-9.0.2-essentials_build.zip"
          $archiveDigest = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          $exeDigest = "3256173f3f8bffd7df12227c68adf68025edb1832273a9530688a7bb1ed8edec"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/$archive" -OutFile $archive
          $actualArchive = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($actualArchive -ne $archiveDigest) { throw "ffmpeg archive digest mismatch: $actualArchive" }
          $extract = "vendor\_ffmpeg_extract"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the verified archive" }
          $actualExe = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLower()
          if ($actualExe -ne $exeDigest) { throw "ffmpeg.exe digest mismatch: $actualExe" }
          Move-Item -Path $exe.FullName -Destination "vendor\ffmpeg.exe" -Force
          Remove-Item -Recurse -Force $extract
          Remove-Item -Force $archive
      - name: Stage the ffmpeg sidecar for the installer
        # A frozen build resolves ffmpeg.exe beside sys.executable, and the
        # installer packages both binaries out of dist\. The binary was
        # fetched and verified by the previous step.
        shell: pwsh
        run: |
          Copy-Item -Path "vendor\ffmpeg.exe" -Destination "dist\ffmpeg.exe"
          if (-not (Test-Path "dist\ffmpeg.exe")) { throw "ffmpeg sidecar was not staged" }
      - name: Build Windows setup (Inno Setup)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$version" "installer\flux.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "dist\flux-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Expected artifact $setup was not produced" }
      - name: Enforce the installer size budget
        # The 105 MB sidecar is LZMA2-compressed to ~30 MiB inside the setup,
        # but cap the real artifact rather than trusting that estimate: the
        # PRD's "<100 MB installer" criterion is decimal MB, not MiB.
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $setup = "dist\flux-setup-$version.exe"
          $bytes = (Get-Item $setup).Length
          $limit = 100 * 1000 * 1000
          $mb = [math]::Round($bytes / 1000000, 1)
          Write-Host "Installer is $mb MB ($bytes bytes); limit is 100 MB"
          if ($bytes -ge $limit) { throw "Installer exceeds the 100 MB success criterion" }
      - name: Publish the installer's SHA-256
        shell: pwsh
        # The updater refuses an installer whose published digest it cannot
        # fetch or match, so every release must carry this file next to the
        # setup. Format is sha256sum-compatible: "<64 hex>  <name>".
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $setup = "dist\flux-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Expected artifact $setup was not produced" }
          $digest = (Get-FileHash -Algorithm SHA256 -Path $setup).Hash.ToLower()
          "$digest  flux-setup-$version.exe" | Set-Content -Encoding ascii "dist\flux-setup-$version.exe.sha256"
          if (-not (Test-Path "dist\flux-setup-$version.exe.sha256")) { throw "checksum file was not produced" }
      - name: Upload exe, setup, sidecar and checksum to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # The last two globs are optional companions for the portable exe:
          # copy the binary next to flux.exe to unlock video and keep the
          # licence text beside it (GPLv3). The updater ignores both (no
          # "setup" in their names) and keeps downloading the installer.
          files: |
            dist/flux.exe
            dist/flux-setup-*.exe
            dist/flux-setup-*.exe.sha256
            dist/ffmpeg.exe
            vendor/LICENSE-ffmpeg.txt
          generate_release_notes: true