name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches pyproject.toml and flux.__version__
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "([^"]+)"/\1/')"
          init_version="$(grep -E '^__version__ = ' src/flux/__init__.py | head -1 | sed -E 's/^__version__ = "([^"]+)"/\1/')"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag version '$tag_version' does not match pyproject.toml version '$pyproject_version'"
            exit 1
          fi
          if [ "$pyproject_version" != "$init_version" ]; then
            echo "pyproject.toml version '$pyproject_version' does not match flux.__version__ '$init_version'"
            exit 1
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run pytest tests/

  build-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv python install 3.12
      - run: uv sync
      - name: Build executable (PyInstaller)
        run: uv run pyinstaller flux.spec
      - name: Smoke test the built executable
        # PowerShell does not wait for windowed (console-less) executables,
        # so Start-Process -Wait is required to observe the exit code.
        # -RedirectStandardOutput hands the process a real stdout handle, so
        # sys.stdout exists even without a console and the printed version is
        # assertable (sys.stdout is None only when nothing supplies a handle,
        # e.g. a plain Explorer launch). This still runs the full frozen import
        # chain (webview, Pillow, flux) without opening a window.
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $out = Join-Path $env:TEMP 'flux-version.txt'
          $proc = Start-Process -FilePath ".\dist\flux.exe" -ArgumentList "--version" -Wait -PassThru -RedirectStandardOutput $out
          if ($proc.ExitCode -ne 0) { throw "flux.exe --version exited with code $($proc.ExitCode)" }
          $reported = (Get-Content $out -Raw).Trim()
          if ($reported -ne "flux $version") { throw "flux.exe --version reported '$reported', expected 'flux $version'" }
      - name: Build Windows setup (Inno Setup)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$version" "installer\flux.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "dist\flux-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Expected artifact $setup was not produced" }
      - name: Publish the installer's SHA-256
        shell: pwsh
        # The updater refuses an installer whose published digest it cannot
        # fetch or match, so every release must carry this file next to the
        # setup. Format is sha256sum-compatible: "<64 hex>  <name>".
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $setup = "dist\flux-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Expected artifact $setup was not produced" }
          $digest = (Get-FileHash -Algorithm SHA256 -Path $setup).Hash.ToLower()
          "$digest  flux-setup-$version.exe" | Set-Content -Encoding ascii "dist\flux-setup-$version.exe.sha256"
          if (-not (Test-Path "dist\flux-setup-$version.exe.sha256")) { throw "checksum file was not produced" }
      - name: Upload exe, setup and checksum to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/flux.exe
            dist/flux-setup-*.exe
            dist/flux-setup-*.exe.sha256
          generate_release_notes: true